[workspace]
members = ["crates/api", "crates/cli", "crates/tui"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/andrewrabert/aweber-cli"
homepage = "https://github.com/andrewrabert/aweber-cli"

[workspace.dependencies]
aweber = { version = "0.6.0", path = "crates/api" }
aweber-tui = { version = "0.6.0", path = "crates/tui" }
anyhow = "1"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
assert_cmd = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "string", "env"] }
colored_json = "5.0.0"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
indexmap = "2"
insta = "1.48"
nucleo-matcher = "0.3.1"
open = "5"
predicates = "3"
ratatui = "0.30.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
tempfile = "3"
throbber-widgets-tui = "0.11.1"
tokio = { version = "1" }
tokio-util = "0.7"
tui-input = "0.15.4"
tui-tree-widget = "0.24.1"
uuid = { version = "1.0", features = ["serde", "v4"] }
wiremock = "0.6"

[workspace.lints.rust]
dead_code = "deny"

[workspace.lints.clippy]
from_over_into = "deny"
inherent_to_string = "deny"
should_implement_trait = "deny"
wrong_self_convention = "deny"
