[package]
name = "aweber"
description = "A Rust client library and command-line interface for the AWeber API"
version = "0.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/andrewrabert/aweber-cli"
homepage = "https://github.com/andrewrabert/aweber-cli"

[features]
default = ["cli"]
workflows = []
cli = [
    "workflows",
    "dep:anyhow",
    "dep:clap",
    "dep:colored_json",
    "dep:dirs",
    "dep:indexmap",
    "dep:open",
    "dep:rustls",
    "dep:tokio",
]

[[bin]]
name = "aweber"
path = "src/cli/main.rs"
required-features = ["cli"]

[[test]]
name = "cli_messages"
path = "tests/cli/messages.rs"
required-features = ["cli"]

[[test]]
name = "cli_workflows"
path = "tests/cli/workflows.rs"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1", optional = true }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "string", "env"], optional = true }
colored_json = { version = "5.0.0", optional = true }
dirs = { version = "7", optional = true }
indexmap = { version = "2", optional = true }
open = { version = "5", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
tokio = { version = "1", features = ["full"], optional = true }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"

[lints.rust]
dead_code = "deny"

[lints.clippy]
from_over_into = "deny"
inherent_to_string = "deny"
should_implement_trait = "deny"
wrong_self_convention = "deny"
